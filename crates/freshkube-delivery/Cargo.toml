[package]
name = "freshkube-delivery"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Delivery chain reads and joins (Kargo, Argo CD, builds) and the applications derived from them"

[dependencies]
freshkube-core.workspace = true
talos-rs.workspace = true
tokio.workspace = true
kube.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures.workspace = true
http.workspace = true
http-body-util = "0.1"
url = "2"
rustls.workspace = true
serde.workspace = true
base64.workspace = true
# The check that can make a link Confirmed: ECDSA over P-256, the key type
# `cosign generate-key-pair` writes. See docs/SUPPLY_CHAIN.md, "The crates".
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem"] }
sha2 = "0.11"
chrono.workspace = true

[features]
testing = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
