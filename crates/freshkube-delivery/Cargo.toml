[package]
name = "freshkube-delivery"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Delivery chain reads and joins (Kargo, Argo CD, builds) and the applications derived from them"

[dependencies]
freshkube-core.workspace = true
talos-rs.workspace = true
tokio.workspace = true
kube.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
futures.workspace = true
http.workspace = true
http-body-util = "0.1"
url = "2"
rustls.workspace = true
serde.workspace = true
base64.workspace = true
# The check that can make a link Confirmed: ECDSA over P-256 through `ring`,
# already in the build for rustls. See docs/SUPPLY_CHAIN.md, "The crates".
ring = "0.17"
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Only for the fake GitHub that dependents' tests use (`features = ["testing"]`).
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }

[features]
testing = ["dep:tokio-rustls"]

[dev-dependencies]
freshkube-core = { workspace = true, features = ["testing"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
