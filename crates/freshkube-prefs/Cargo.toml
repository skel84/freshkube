[package]
name = "freshkube-prefs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The preferences files: where they live and how one is read and written"

[dependencies]
serde.workspace = true
# The app builds with insertion order (a dependency turns it on), and the
# files are written in it; say so here so this crate alone builds the same.
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
