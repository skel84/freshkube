[package]
name = "freshkube-followed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "What the user follows: the app-wide owner that watches pods, Kargo projects and Coroot for updates, and the toasts and bell that show them"

[lib]
# This library has no doctests; re-enable them if an example is added.
doctest = false

[dependencies]
gpui-kit = "=0.7.0"
freshkube-core.workspace = true
freshkube-delivery.workspace = true
freshkube-prefs.workspace = true
freshkube-reads.workspace = true
freshkube-ui.workspace = true
chrono.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Test hooks for the desktop's tests (`deliver_for_tests`); turned on from
# dev-dependencies.
testing = []

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
freshkube-core = { workspace = true, features = ["testing"] }
http.workspace = true
