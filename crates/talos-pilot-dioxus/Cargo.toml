[package]
name = "talos-pilot-dioxus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Experimental native Dioxus desktop monitor for Talos clusters"

[features]
default = []
desktop = ["dep:dioxus", "dep:rfd", "dep:futures-channel", "dep:arboard", "dep:parking_lot", "dep:chrono", "dep:kube", "dep:k8s-openapi", "dep:serde_yaml", "dep:serde_json"]

[dependencies]
talos-pilot-core.workspace = true
talos-rs.workspace = true
tokio.workspace = true
color-eyre.workspace = true
futures.workspace = true
dioxus = { version = "=0.7.3", optional = true, default-features = false, features = ["desktop", "macro", "html", "signals", "hooks", "launch", "document"] }
rfd = { workspace = true, optional = true }
# Dioxus core's scheduler uses try_recv, introduced in futures-channel 0.3.32.
futures-channel = { version = "0.3.32", optional = true }
arboard = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
chrono = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
dioxus-ssr = "=0.7.4"
