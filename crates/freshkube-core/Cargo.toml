[package]
name = "freshkube-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Core business logic for freshkube"

[dependencies]
talos-rs.workspace = true
tokio.workspace = true
base64.workspace = true
x509-parser.workspace = true
sha2.workspace = true
tonic.workspace = true

# Kubernetes overview collection
kube.workspace = true
k8s-openapi.workspace = true
zeroize = "1"
serde_yaml.workspace = true
# A flame graph nests deeper than the default recursion limit.
serde_json = { workspace = true, features = ["unbounded_depth"] }
futures.workspace = true
http.workspace = true
http-body-util = "0.1"

# Monitoring: dashboards and Prometheus queries, sent through the service proxy
grafaui-model.workspace = true
grafaui-prometheus.workspace = true
promql-parser = "0.11"
coroot-rs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# The recording fake API (`fake_api`), behind `testing`.
tower = { version = "0.5", features = ["util"], optional = true }

# TLS and logging
rustls.workspace = true
tracing.workspace = true

# Serialization
serde.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true

[features]
# Tests pin the zone log times show in (`logs::pin_zone`) and keep keys in
# memory (`secrets::MemoryStore`).
testing = ["dep:tower"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
# A fake API server that upgrades to the port-forward websocket.
bytes = "1"
# HTTP/1 watch readiness must include hyperium/hyper#4208 (#637).
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# SO_EXCLUSIVEADDRUSE for a forward's listener.
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }
