[package]
name = "freshkube-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core business logic for freshkube"

[dependencies]
talos-rs.workspace = true
tokio.workspace = true
base64.workspace = true
x509-parser.workspace = true
dirs-next.workspace = true
tonic.workspace = true

# Kubernetes overview collection
kube.workspace = true
k8s-openapi.workspace = true
serde_yaml.workspace = true
# A flame graph nests deeper than the default recursion limit.
serde_json = { workspace = true, features = ["unbounded_depth"] }
futures.workspace = true
http.workspace = true
http-body-util = "0.1"

# Monitoring: dashboards and Prometheus queries, sent through the service proxy
grafaui-model.workspace = true
grafaui-prometheus.workspace = true
coroot-rs.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# TLS and logging
rustls.workspace = true
tracing.workspace = true

# Serialization
serde.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true

[features]
# Tests pin the zone log times show in (`logs::pin_zone`).
testing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
# A fake API server that upgrades to the port-forward websocket.
bytes = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
