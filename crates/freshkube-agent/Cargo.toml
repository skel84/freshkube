[package]
name = "freshkube-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "The agent's loopback read endpoint, its session token and the saved per-cluster access"

[lib]
# This library has no doctests; re-enable them if an example is added.
doctest = false

# Core (the reads and the gate), nav (the view a read goes to) and prefs (agent.json):
# no GPUI, and nothing of desktop, freshkube-ui or the feature crates.
[dependencies]
freshkube-core.workspace = true
freshkube-nav.workspace = true
freshkube-prefs.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
http = "1"
# The MCP Streamable HTTP server, pinned exactly: Claude Code and rmcp disagree on
# the 2026-07-28 revision, so a bump is checked against each agent (spikes/agent).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

[dev-dependencies]
freshkube-core = { workspace = true, features = ["testing"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tracing-subscriber.workspace = true
