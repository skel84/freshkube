[package]
name = "freshkube-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# This library has no doctests; re-enable them if an example is added.
doctest = false

[dependencies]
base64.workspace = true
fastrand = "2"
gpui-kit = "=0.7.0"
freshkube-core.workspace = true
freshkube-logs.workspace = true
freshkube-monitoring.workspace = true
freshkube-observability.workspace = true
freshkube-probe.workspace = true
freshkube-terminal.workspace = true
freshkube-ui.workspace = true
talos-rs.workspace = true
tokio.workspace = true
futures.workspace = true
color-eyre.workspace = true
chrono.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
# Where preferences live on each platform.
dirs.workspace = true
# Keys the user asks to remember: Keychain, Credential Manager or Secret Service.
keyring = "4"
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[features]
# The `stress` binary: timings, a key script, a log flood rate and a
# synthetic Kubernetes API. A binary rather than an example, because
# examples get the dev-dependencies, and with them GPUI's test support.
stress = [
    "freshkube-monitoring/stress",
    "freshkube-probe/stress",
    "freshkube-terminal/stress",
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
]

[[bin]]
name = "stress"
required-features = ["stress"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
rustls.workspace = true
tempfile = "3"
# Render probes count in tests (`probe::count`).
freshkube-probe = { workspace = true, features = ["counting"] }
# The shell tests read the terminal's screen (`screen_text`, `ended`).
freshkube-terminal = { workspace = true, features = ["testing"] }
# The log tests pin the zone rows show their times in (`logs::pin_zone`).
freshkube-core = { workspace = true, features = ["testing"] }
# The log tests read the view's state (`applied_and_held`, `retained`, …).
freshkube-logs = { workspace = true, features = ["testing"] }
# The startup and Observability tests read the charts (`reading`, `marker_labels`).
freshkube-monitoring = { workspace = true, features = ["testing"] }
freshkube-observability = { workspace = true, features = ["testing"] }
# The status bar tests read which line a segment drew (`status::shown`).
freshkube-ui = { workspace = true, features = ["testing"] }
# Operations' tests run the example on a paused Tokio clock (`start_paused`).
tokio = { workspace = true, features = ["test-util"] }
# The map's tests measure its boxes in the graph's units (`observability/map.rs`).
freshkube-graph.workspace = true
