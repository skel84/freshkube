[package]
name = "freshkube-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui-kit = "=0.7.0"
freshkube-core.workspace = true
talos-rs.workspace = true
tokio.workspace = true
futures.workspace = true
color-eyre.workspace = true
chrono.workspace = true
kube.workspace = true
serde_json.workspace = true
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

[features]
# The `stress` binary: timings, a key script, a log flood rate and a
# synthetic Kubernetes API. A binary rather than an example, because
# examples get the dev-dependencies, and with them GPUI's test support.
stress = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]

[[bin]]
name = "stress"
required-features = ["stress"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["test-support"] }
