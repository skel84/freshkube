name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# macOS is the only verified platform. GPUI's Linux and Windows builds need
# their own system dependencies and checks before they are added here.
jobs:
  check:
    name: Check, lint and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build tools
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (including headless UI tests)
        run: cargo test --workspace --locked

  build:
    name: macOS application bundles
    uses: ./.github/workflows/macos-app.yml
