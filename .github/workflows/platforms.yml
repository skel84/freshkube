name: Platform checks

# Compile and lint (Linux) is a required check; Compile and lint (Windows) and
# Tests (Windows) stay advisory: a red advisory run blocks review approval, not
# the merge button. Linux is not a matrix entry because a skipped matrix job
# reports its unexpanded name, which a required check would never match.
# Keep failures separate from CI: releases promote that workflow's macOS bundles.
# Linux and Windows check and lint every target; Linux runs the whole test
# suite in that job, and Windows runs it in its own job, Tests (Windows).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Scheduled workflows run on the default branch (main), even without changes.
  schedule:
    - cron: '23 4 * * 1' # Monday, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.head_ref, github.event.pull_request.draft) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Platform changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did the app change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        # Match ci.yml's app/docs filter; scheduled and manual runs always check.
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = schedule ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$HEAD" > changed.txt
          if grep -Ev '^(spikes|docs)/|\.md$' changed.txt > /dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only spikes, docs or Markdown changed; skipping platform checks."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # Linux is a job of its own, not a matrix entry: when `changes` skips a
  # matrix job, GitHub reports its unexpanded name, "Compile and lint
  # (${{ matrix.platform }})", and a required check would never report.
  linux:
    name: Compile and lint (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-check-Linux-tests
          # Linux only until its size and the surviving macOS caches are audited.
          # Main saves dependencies; PRs restore without saving their own copies.
          # Workspace crates are excluded by rust-cache's defaults.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
          repo-token: ${{ github.token }}
      - name: Install GPUI Linux dependencies
        # GPUI Kit 0.7.0's script/install-linux.sh, plus Vulkan headers:
        # https://github.com/longbridge/gpui-kit/blob/0c830f4d257e69fdd17200650533ab4ca9a40cc0/script/install-linux.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan-dev vulkan-validationlayers libvulkan1
      - name: Check every target
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (including headless UI tests)
        # GPUI's test platform needs no display; the workspace run includes
        # the terminal keyboard tests.
        run: cargo test --workspace --locked --no-fail-fast

  windows:
    name: Compile and lint (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
          repo-token: ${{ github.token }}
      - name: Check every target
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Terminal keyboard UI tests
        run: cargo test -p freshkube-terminal --lib keyboard --locked

  windows-tests:
    name: Tests (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    # Advisory: a failure here shows on the run but leaves the workflow green.
    # The suite has passed on Windows since #383 (9efd075); it stays advisory
    # until a later decision makes it count.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache: Windows stays uncached until the shared cache budget is
      # audited (docs/MACOS_PACKAGING.md#ci).
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
          repo-token: ${{ github.token }}
      - name: Tests (including headless UI tests)
        # GPUI's test platform needs no display, as on Linux.
        run: cargo test --workspace --locked --no-fail-fast
