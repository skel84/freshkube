[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2024"
authors = ["Ken Udovic", "Francesco Cislaghi"]
license = "MIT"
repository = "https://github.com/skel84/freshkube"
homepage = "https://github.com/skel84/freshkube"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots", "channel"] }
prost = "0.13"
prost-types = "0.13"

# TLS
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# Kubernetes client
kube = { version = "0.98", features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
    # An http:// proxy from HTTPS_PROXY or a kubeconfig's proxy-url, as
    # kubectl takes it (#335).
    "http-proxy",
    # Pod exec runs over a websocket (docs/POD_EXEC.md).
    "ws",
], default-features = false }
k8s-openapi = { version = "0.24", features = ["latest"] }
http = "1"

# Certificate parsing
x509-parser = "0.16"

# Prometheus dashboards: grafaui's model and query crates (MIT, the user's
# own), pinned by revision; Freshkube draws its own panels (docs/MONITORING.md).
grafaui-model = { git = "https://github.com/skel84/grafaui", rev = "72038698db515ce37fe00636b6a964b4358fce95" }
grafaui-prometheus = { git = "https://github.com/skel84/grafaui", rev = "72038698db515ce37fe00636b6a964b4358fce95", default-features = false }
coroot-rs = { git = "https://github.com/skel84/corust", rev = "a1fd85d649a9274d8a4ad774d16d671c4278781d" }

# Internal crates
talos-rs = { path = "crates/talos-rs" }
freshkube-core = { path = "crates/freshkube-core" }
freshkube-graph = { path = "crates/freshkube-graph" }
freshkube-logs = { path = "crates/freshkube-logs" }
freshkube-monitoring = { path = "crates/freshkube-monitoring" }
freshkube-probe = { path = "crates/freshkube-probe" }
freshkube-terminal = { path = "crates/freshkube-terminal" }
freshkube-desktop = { path = "crates/freshkube-desktop" }
freshkube-ui = { path = "crates/freshkube-ui" }

[package]
name = "freshkube"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Native desktop app for Talos Linux and Kubernetes clusters"

[features]
# A downloaded debug binary cannot read GPUI Kit's icons from the CI runner.
capture-embed = ["dep:rust-embed"]

[dependencies]
freshkube-desktop.workspace = true
freshkube-probe.workspace = true
clap.workspace = true
tokio.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Match gpui-kit-assets' resolved version so debug-embed unifies with its assets.
rust-embed = { version = "=8.12.0", optional = true, features = ["debug-embed"] }

[target.'cfg(windows)'.dependencies]
# AttachConsole, for a release build's output in the terminal that started it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# Keep source-line backtraces in development, matching CI.
[profile.dev]
debug = "line-tables-only"

# Unoptimised GPUI draws a frame roughly 14x slower. Optimise dependencies in
# dev builds; workspace crates stay unoptimised so they rebuild quickly. Line
# tables keep dependency backtraces readable without full debug info on disk.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"
