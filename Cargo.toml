[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
authors = ["Ken Udovic"]
license = "MIT"
repository = "https://github.com/Handfish/talos-pilot"
homepage = "https://github.com/Handfish/talos-pilot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots", "channel"] }
prost = "0.13"
prost-types = "0.13"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"
tachyonfx = "0.9"

# Desktop GUI
eframe = { version = "=0.32.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
arboard = "3"

# Kubernetes client
kube = { version = "0.98", features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
], default-features = false }
k8s-openapi = { version = "0.24", features = ["latest"] }

# Certificate parsing
x509-parser = "0.16"

# Internal crates
talos-rs = { path = "crates/talos-rs" }
talos-pilot-core = { path = "crates/talos-pilot-core" }
talos-pilot-tui = { path = "crates/talos-pilot-tui" }
talos-pilot-gui = { path = "crates/talos-pilot-gui" }
talos-pilot-dioxus = { path = "crates/talos-pilot-dioxus" }
talos-pilot-gpui = { path = "crates/talos-pilot-gpui" }

[package]
name = "talos-pilot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal and native desktop interfaces for managing and monitoring Talos Linux Kubernetes clusters"

[features]
default = []
# Experimental desktop frontend; leave system WebView dependencies opt-in.
dioxus-ui = ["dep:talos-pilot-dioxus", "talos-pilot-dioxus/desktop"]
# Readonly GPUI Kit prototype; native dependencies remain opt-in.
gpui-ui = ["dep:talos-pilot-gpui", "talos-pilot-gpui/desktop"]

[dependencies]
talos-pilot-tui.workspace = true
talos-pilot-gui.workspace = true
talos-pilot-dioxus = { workspace = true, optional = true }
talos-pilot-gpui = { workspace = true, optional = true }
talos-rs.workspace = true
clap.workspace = true
tokio.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Unoptimised GPUI draws a frame roughly 14x slower. Optimise dependencies in
# dev builds; workspace crates stay unoptimised so they rebuild quickly. Line
# tables keep dependency backtraces readable without full debug info on disk.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
